# 临时验证（诊断版）：测 CAN SLIM 线上效果 + 对照 known-good 路由。验证完即删。
name: Verify CANSLIM

on:
  push:
    branches: [claude/dreamy-cray-GFpRu]
    paths: [.github/workflows/verify-canslim.yml]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Test live canslim report
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          sleep 40
          SUB=$(curl -s -H "Authorization: Bearer $CF_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/subdomain" | python3 -c "import sys,json;print(json.load(sys.stdin)['result']['subdomain'])")
          BASE="https://aisicnews.$SUB.workers.dev"
          echo "BASE=$BASE"
          echo "--- known-good: /api/vidnotes ---"
          curl -s -o /tmp/a -w "HTTP %{http_code}\n" "$BASE/api/vidnotes"; head -c 80 /tmp/a; echo
          echo "--- graham KO (was working) ---"
          curl -s -o /tmp/b -w "HTTP %{http_code} %{time_total}s\n" --max-time 60 "$BASE/api/report?symbol=KO&strategy=graham"; head -c 120 /tmp/b; echo
          echo "--- canslim NVDA ---"
          curl -s -o /tmp/c -w "HTTP %{http_code} %{time_total}s\n" --max-time 150 "$BASE/api/report?symbol=NVDA&strategy=canslim"; head -c 400 /tmp/c; echo
          echo "--- canslim 00700 hk ---"
          curl -s -o /tmp/d -w "HTTP %{http_code} %{time_total}s\n" --max-time 150 "$BASE/api/report?symbol=00700&market=hk&strategy=canslim"; head -c 400 /tmp/d; echo
          echo "--- summaries ---"
          for f in /tmp/c /tmp/d; do python3 -c "import json;d=json.load(open('$f'));md=d.get('md','');print('ERR:',d.get('error')) if d.get('error') else print(chr(10).join([l[:110] for l in md.splitlines() if l.startswith('**日期**') or '关注' in l or '候选' in l or '观察' in l or '暂不' in l or '空仓' in l or 'RS Rating |' in l or l.startswith('### ✅') or l.startswith('### ❌')][:24]))" 2>/dev/null || echo "  (not json)"; echo; done
