# 手动执行 D1 迁移（只能手动触发，不会随任何 push 自动运行）。
# 用法：GitHub → Actions → 「D1 Migrate」→ Run workflow → 选分支、确认文件路径 → Run。
# 复用与 deploy.yml 相同的仓库机密（CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID），
# 所以本地无需安装或登录 wrangler。
name: D1 Migrate

on:
  workflow_dispatch:
    inputs:
      file:
        description: "要执行的迁移文件（相对仓库根目录）"
        required: true
        default: "migrations/0005_optimize_writes.sql"

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: 对线上 D1 执行迁移
        # 迁移文件经由环境变量传入，不直接插进命令行，避免 shell 注入。
        run: npx wrangler d1 execute ai-sic-news --remote --yes --file="$MIGRATION_FILE"
        env:
          MIGRATION_FILE: ${{ inputs.file }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 核对 articles 表当前索引
        # 迁移后打印剩余索引，用于确认结果（预期只剩 published / layer / value / title_key 四个）。
        run: |
          npx wrangler d1 execute ai-sic-news --remote --yes \
            --command "SELECT name FROM sqlite_master WHERE type='index' AND tbl_name='articles' ORDER BY name"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
