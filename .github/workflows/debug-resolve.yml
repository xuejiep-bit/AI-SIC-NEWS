# 临时工具：检查 YouTube 频道 RSS 的最新发布时间（沙箱访问不了 YouTube，借 CI 跑）。用完即删。
name: Resolve Channel ID

on:
  push:
    branches: [claude/dreamy-cray-GFpRu]

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Check BG2 RSS entries
        run: |
          curl -s "https://www.youtube.com/feeds/videos.xml?channel_id=UC-yRDvpR99LUc5l7i7jLzew" -o /tmp/f.xml
          echo "HTTP size: $(wc -c < /tmp/f.xml)"
          grep -o "<title>[^<]*</title>" /tmp/f.xml | head -5
          grep -o "<published>[^<]*</published>" /tmp/f.xml | head -8
