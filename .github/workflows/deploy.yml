# 自动部署到 Cloudflare Workers。
# 触发：push 到 main，或在 GitHub → Actions 页面手动触发（可选任意分支）。
# 前置：在仓库 Settings → Secrets and variables → Actions 里配置：
#   CLOUDFLARE_API_TOKEN   必填，Cloudflare API Token（模板选 "Edit Cloudflare Workers"）
#   CLOUDFLARE_ACCOUNT_ID  建议填，Cloudflare 账户 ID（Dashboard 首页右侧可见）
name: Deploy

on:
  push:
    branches: [main, claude/dreamy-cray-GFpRu]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
