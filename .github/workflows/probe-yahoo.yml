# 临时验证：调用线上 /api/report 实测 Graham 报告（KO + 00700）。验证完即删。
name: Probe Yahoo

on:
  push:
    branches: [claude/dreamy-cray-GFpRu]
    paths: [.github/workflows/probe-yahoo.yml]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Test live /api/report
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          SUB=$(curl -s -H "Authorization: Bearer $CF_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/subdomain" | python3 -c "import sys,json;print(json.load(sys.stdin)['result']['subdomain'])")
          BASE="https://aisicnews.$SUB.workers.dev"
          for Q in "symbol=KO" "symbol=00700&market=hk"; do
            echo "=============== /api/report?$Q ==============="
            curl -s --max-time 120 "$BASE/api/report?$Q" -o /tmp/r.json -w "HTTP %{http_code} time %{time_total}s\n"
            python3 -c "import json;d=json.load(open('/tmp/r.json'));print('ERROR:',d.get('error')) if d.get('error') else print('symbol:',d.get('symbol'),'| cached:',d.get('cached'),'| md len:',len(d['md']))"
            python3 -c "import json;d=json.load(open('/tmp/r.json'));md=d.get('md','');print(chr(10).join([l[:130] for l in md.splitlines() if l.startswith('# ') or l.startswith('**日期**') or '候选' in l or '达标 (' in l or '不符合' in l or l.startswith('### ✅') or l.startswith('### ❌')][:30]))"
          done
