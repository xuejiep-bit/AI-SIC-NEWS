# 临时验证：调用线上 /api/report 实测 Graham 报告（KO + 00700）。验证完即删。
name: Probe Yahoo

on:
  push:
    branches: [claude/dreamy-cray-GFpRu]
    paths: [.github/workflows/probe-yahoo.yml]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Test live /api/report
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          SUB=$(curl -s -H "Authorization: Bearer $CF_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/subdomain" | python3 -c "import sys,json;print(json.load(sys.stdin)['result']['subdomain'])")
          BASE="https://aisicnews.$SUB.workers.dev"
          echo "=============== KO dividends raw years (debug G4) ==============="
          curl -s -A "Mozilla/5.0" "https://query1.finance.yahoo.com/v8/finance/chart/KO?range=max&interval=1mo&events=div" -o /tmp/c.json -w "HTTP %{http_code}\n"
          python3 -c "import json,datetime;d=json.load(open('/tmp/c.json'));ev=d['chart']['result'][0].get('events',{}).get('dividends',{});ys=sorted({datetime.datetime.utcfromtimestamp(v['date']).year for v in ev.values()});print('years(',len(ys),'):',ys)"
          python3 -c "import json,datetime;d=json.load(open('/tmp/c.json'));ev=d['chart']['result'][0].get('events',{}).get('dividends',{});ds=sorted(v['date'] for v in ev.values());print('last 5 raw dates:',[datetime.datetime.utcfromtimestamp(x).isoformat() for x in ds[-5:]])"
