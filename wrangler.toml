name = "aisicnews"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# 静态前端资源（public 目录）由 Worker 直接 inline 提供，这里不单独配置 assets。

# 定时触发：整点抓取入库，半点翻译英文资讯（分开避免单次请求子请求超限）。
[triggers]
crons = ["0 * * * *", "30 * * * *"]

# D1 数据库绑定。首次使用前需要创建：
#   npx wrangler d1 create ai-sic-news
# 然后把下面的 database_id 替换为命令输出的真实 ID。
[[d1_databases]]
binding = "DB"
database_name = "ai-sic-news"
database_id = "b18f2d72-b0be-4bcd-b954-26fe8bd38226"

# Cloudflare Workers AI 绑定（模块2 英文资讯翻译）。无需密钥，账号自带免费额度。
[ai]
binding = "AI"

[vars]
# 手动触发抓取接口 /api/refresh 的保护令牌。部署后请改成你自己的随机值，
# 或用 `wrangler secret put REFRESH_TOKEN` 设为机密。留空表示不校验（仅建议本地开发时）。
REFRESH_TOKEN = ""

# 是否开启 Claude 语义分类 + 中文标题翻译。设为 "1" 开启（需同时配置 ANTHROPIC_API_KEY 机密）。
# 关闭时使用关键词分类（零成本）。
USE_AI = ""

# Claude 模型。默认 claude-opus-4-8（最准）。这是每小时批量分类任务，
# 若想显著降低成本，可改为 "claude-haiku-4-5"。
AI_MODEL = "claude-opus-4-8"

# 数据保留天数；超过则在每次抓取后清理。设为 "0" 表示永不清理。
RETENTION_DAYS = "30"

# 模块2：英文资讯翻译用的 Workers AI 模型。默认 Llama 3.1 8B（省额度、输出稳定）。
# 想要更地道的中文可改为 "@cf/zai-org/glm-4.7-flash" 或 "@cf/qwen/qwen3-30b-a3b-fp8"。
AI_TRANSLATE_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"

# 每轮（每小时）翻译条数上限，控制 Workers AI 免费额度消耗（约每天 1 万 neurons）。
TRANSLATE_PER_RUN = "20"

# ANTHROPIC_API_KEY 不要写在这里——用机密方式设置：
#   npx wrangler secret put ANTHROPIC_API_KEY
