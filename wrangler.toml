name = "aisicnews"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# 静态前端资源（public 目录）由 Worker 直接 inline 提供，这里不单独配置 assets。

# 自定义域名：把本站绑到 ai.vid2quiz.com（部署时由 wrangler 自动创建域名+证书）。
# 用子域名，不影响 vid2quiz.com 根域名上原有的项目。
routes = [
  { pattern = "ai.vid2quiz.com", custom_domain = true },
]

# 定时抓取：每天 2 次（UTC 01:00 / 13:00 = 北京时间 09:00 / 21:00）。
# 降频 + 入库前过滤是 D1 免费额度（10 万行写入/天）内运行的关键，勿随意调回每小时。
[triggers]
crons = ["0 1,13 * * *"]

# D1 数据库绑定。首次使用前需要创建：
#   npx wrangler d1 create ai-sic-news
# 然后把下面的 database_id 替换为命令输出的真实 ID。
[[d1_databases]]
binding = "DB"
database_name = "ai-sic-news"
database_id = "b18f2d72-b0be-4bcd-b954-26fe8bd38226"

[vars]
# 管理接口（/api/refresh、/api/reclassify、/api/rescore-value）的保护令牌。
# 留空 = 这些接口整体关闭（定时抓取不受影响）。要启用请设一个随机值，
# 或用 `wrangler secret put REFRESH_TOKEN` 设为机密。
REFRESH_TOKEN = ""

# 是否开启 Claude 语义分类 + 中文标题翻译。设为 "1" 开启（需同时配置 ANTHROPIC_API_KEY 机密）。
# 关闭时使用关键词分类（零成本）。
USE_AI = ""

# Claude 模型。默认 claude-opus-4-8（最准）。这是每小时批量分类任务，
# 若想显著降低成本，可改为 "claude-haiku-4-5"。
AI_MODEL = "claude-opus-4-8"

# 资讯保留时长（小时）。默认保留近 7 天（168 小时）；超时的资讯在每次抓取后自动清理。设为 "0" 表示永不清理。
# 注意：D1 的 DELETE 也按行计费（且每行连带索引一起算），保留期长短不影响总删除量，
# 真正省写入靠入库前过滤（见 PER_FEED_LIMIT / INGEST_MIN_VALUE）。
RETENTION_HOURS = "168"

# 「重要资讯」永久保留的门槛：价值分 ≥ 此值的资讯不受上面保留时长限制、长期保留。
# 默认与 PICKS_THRESHOLD 一致（即凡是进过「今日精选」的都永久留存）。想更严可调高（如 "8"）。
KEEP_SCORE = "7"

# ── 写入量控制（D1 免费额度保护）────────────────────
# 每个源每轮最多取按发布时间最新的 N 条。压掉 Google News 检索源一次返回上百条的长尾。
PER_FEED_LIMIT = "10"

# 入库门槛：分类为 other（不属于 AI 产业链）的资讯，价值分 ≥ 此值才入库，否则直接丢弃。
# 已分入 upstream/midstream/downstream 的资讯与视频不受此限制。设为 "0" 关闭过滤。
INGEST_MIN_VALUE = "4"

# 「今日精选」默认分数阈值（1-10）。只保留价值分 ≥ 此值的资讯进入精选。
# 前端可用 ?min= 实时覆盖试调，找到合适的线后再改这里固化默认值。
PICKS_THRESHOLD = "7"

# ANTHROPIC_API_KEY 不要写在这里——用机密方式设置：
#   npx wrangler secret put ANTHROPIC_API_KEY

# 订阅邮箱导出接口（/api/subscribers.csv?token=…）的密钥。请用机密方式设置：
#   npx wrangler secret put EXPORT_TOKEN
# 未设置时导出接口整体关闭（订阅收集不受影响）。
