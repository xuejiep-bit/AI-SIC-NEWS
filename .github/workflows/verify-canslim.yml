# 临时验证：用正式域名 ai.vid2quiz.com 测 CAN SLIM。验证完即删。
name: Verify CANSLIM

on:
  push:
    branches: [claude/dreamy-cray-GFpRu]
    paths: [.github/workflows/verify-canslim.yml]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Test live canslim report via custom domain
        run: |
          sleep 40
          BASE="https://ai.vid2quiz.com"
          echo "--- known-good: /api/vidnotes ---"
          curl -s -o /tmp/a -w "HTTP %{http_code}\n" "$BASE/api/vidnotes"; head -c 60 /tmp/a; echo
          for Q in "symbol=NVDA&strategy=canslim" "symbol=KO&strategy=canslim" "symbol=00700&market=hk&strategy=canslim"; do
            echo "=============== $Q ==============="
            curl -s -o /tmp/r -w "HTTP %{http_code} %{time_total}s\n" --max-time 150 "$BASE/api/report?$Q"
            python3 -c "import json;d=json.load(open('/tmp/r'));md=d.get('md','');print('ERR:',d.get('error')) if d.get('error') else print(chr(10).join([l[:115] for l in md.splitlines() if l.startswith('**日期**') or '关注' in l or '候选' in l or '观察名单' in l or '暂不考虑' in l or '空仓' in l or 'RS Rating |' in l or l.startswith('### ✅') or l.startswith('### ❌')][:26]))" 2>/dev/null || { echo "(not json, raw:)"; head -c 200 /tmp/r; echo; }
          done
