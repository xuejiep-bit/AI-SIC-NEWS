# 临时工具：触发一轮线上翻译并打印结果（沙箱连不上线上，借 CI 网络）。验证完即删。
name: Debug Translate

on:
  workflow_dispatch:
  push:
    branches: [claude/dreamy-cray-GFpRu]
    paths: [.github/workflows/debug-translate.yml]

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve worker URL and trigger /api/translate
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          SUB=$(curl -s -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/subdomain" \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['result']['subdomain'])")
          URL="https://aisicnews.$SUB.workers.dev/api/translate"
          echo "Triggering: $URL"
          curl -s --max-time 280 "$URL" | python3 -m json.tool   # run 2
