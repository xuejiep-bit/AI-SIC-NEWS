# 临时验证：用正式域名测海龟（美股 AAPL + 港股 00700，对照样例）。验证完即删。
name: Verify Turtle

on:
  push:
    branches: [claude/dreamy-cray-GFpRu]
    paths: [.github/workflows/verify-turtle.yml]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Test live turtle report
        run: |
          sleep 40
          BASE="https://ai.vid2quiz.com"
          for Q in "symbol=AAPL&strategy=turtle" "symbol=00700&market=hk&strategy=turtle" "symbol=NVDA&strategy=turtle&account=100000"; do
            echo "=============== $Q ==============="
            curl -s -o /tmp/r -w "HTTP %{http_code} %{time_total}s\n" --max-time 60 "$BASE/api/report?$Q"
            python3 -c "import json;d=json.load(open('/tmp/r'));md=d.get('md','');print('ERR:',d.get('error')) if d.get('error') else print(chr(10).join([l[:120] for l in md.splitlines() if '综合信号' in l or '一句话' in l or 'N (20' in l or '建议股数' in l or '执行建议' in l or '止损价' in l or '强势打分' in l][:14]))" 2>/dev/null || { echo "(not json)"; head -c 200 /tmp/r; echo; }
          done
